name: CI

# Builds and tests Orbital on every push to main, every PR, and on demand.
# PyInstaller cannot cross-compile, so the macOS .dmg is built on an Apple
# Silicon runner (macos-14) and the Windows installer on windows-latest.
#
# NOTE: this is the project's first CI. The build steps mirror the manual
# release runbook in CLAUDE.md (scripts/build-macos.sh, scripts/build-desktop.sh).
# The installers are unsigned/ad-hoc — signing & notarization remain out of scope.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes (macOS/Windows
# minutes are billed at a premium on private repos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + vitest + i18n)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: TypeScript build (zero errors required)
        run: npx tsc -b
      - name: Vitest
        run: npm run test
      - name: i18n catalog check
        run: node scripts/check-i18n.mjs

  backend-tests:
    name: Backend unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # ApiKeyStore.get_api_key() returns this env var BEFORE ever calling
      # keyring, which otherwise blocks on a headless macOS runner's Keychain.
      # The null backend neutralizes any stray keyring use elsewhere.
      AGENT_OS_API_KEY: ci-dummy-key
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,desktop,dev]"
      - name: Run unit tests
        # tests/unit/ only. tests/platform/ spawns a real sandbox-exec against
        # ~/Desktop (can EPERM-lock the tree) and carries 3 documented env-fails,
        # so it is intentionally excluded from CI — see CLAUDE.md "Known Issues".
        run: python -m pytest tests/unit/ -q

  build-macos:
    name: Build macOS .dmg
    # Gate on the frontend job (validated locally). backend-tests runs as an
    # independent signal but does NOT block artifact production — so a flaky
    # platform-specific unit test can't stop the installer from building.
    needs: [frontend]
    # Skip the heavy build jobs on PRs; build on push to main, tags, and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: macos-14  # Apple Silicon → arm64 build (matches release runbook)
    env:
      # Developer ID signing + notarization secrets. SAFE on a public repo:
      # this job never runs on pull_request (gated above), and GitHub never
      # exposes secrets to fork-PR runs regardless — so only push-to-main, v*
      # tags, and manual dispatch (all write-access-only) can read them.
      # When the secrets are unset every signing step below no-ops and
      # build-macos.sh falls back to its ad-hoc path: the DMG still builds,
      # just unsigned. Actual signing only fires on tags / manual dispatch
      # (see the "Decide whether to sign" gate) to keep main-push builds fast.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install package + build deps (PyInstaller, patchright, Pillow)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,desktop,dev]"
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Decide whether to sign (v* tags + manual dispatch only)
        # Sign + notarize only for releases (tag pushes) and manual runs, and
        # only when the signing cert secret is configured. Plain main-push
        # builds stay ad-hoc so day-to-day CI isn't gated on Apple's notary
        # service. Flip the ref check here if you want every main build signed.
        id: gate
        run: |
          if [ -n "$MACOS_CERT_P12_BASE64" ] && { [[ "$GITHUB_REF" == refs/tags/v* ]] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; }; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing + notarization: ENABLED for this build."
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "Ad-hoc (unsigned) build — signing fires only on v* tags / manual dispatch with secrets set."
          fi
      - name: Set up Developer ID keychain + notary key
        # Imports the .p12 into a throwaway keychain and writes the App Store
        # Connect .p8 to RUNNER_TEMP so build-macos.sh can sign inside-out and
        # notarize. Secrets are decoded but never printed.
        if: ${{ steps.gate.outputs.sign == 'true' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$MACOS_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

          # Throwaway keychain, unlocked, with the Developer ID cert imported.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Let codesign use the private key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Prepend our keychain to the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')

          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build .app + .dmg
        # Builds the SPA, runs PyInstaller, signs (Developer ID inside-out when
        # ORBITAL_SIGN_IDENTITY is set, else ad-hoc), runs the bundle integrity
        # asserts, packages the DMG (hdiutil fallback; no brew), and notarizes +
        # staples when notary creds are present.
        env:
          ORBITAL_SIGN_IDENTITY: ${{ steps.gate.outputs.sign == 'true' && env.MACOS_SIGN_IDENTITY || '' }}
          ORBITAL_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          ORBITAL_NOTARY_KEY_ID: ${{ env.MACOS_NOTARY_KEY_ID }}
          ORBITAL_NOTARY_ISSUER: ${{ env.MACOS_NOTARY_ISSUER }}
        run: bash scripts/build-macos.sh
      - name: Show binary arch
        run: file dist/Orbital.app/Contents/MacOS/Orbital
      - name: Smoke test — packaged daemon boots
        # Boots the bundled daemon headlessly (--smoke-test) and asserts its
        # HTTP server answers. Catches a bundle that builds but cannot start —
        # e.g. the httptools packaging gap that uvicorn dies on. The check
        # self-terminates within wait_for_daemon's timeout, so a foreground
        # run is safe and its exit code gates the job.
        run: ./dist/Orbital.app/Contents/MacOS/Orbital --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: Orbital-macOS-dmg
          path: dist/Orbital-*-macOS.dmg
          if-no-files-found: error
      - name: Clean up signing keychain + notary key
        # Belt-and-suspenders on the ephemeral hosted runner; mandatory if this
        # ever moves to a self-hosted box. Runs even when the build failed.
        if: ${{ always() && steps.gate.outputs.sign == 'true' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"

  build-windows:
    name: Build Windows installer
    needs: [frontend]  # see build-macos: builds aren't gated on backend-tests
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install package + build deps (PyInstaller, patchright)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,desktop,dev]"
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install Inno Setup (provides iscc for the installer)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
      - name: Build PyInstaller bundle + Inno Setup installer
        # build-desktop.sh builds the SPA, runs PyInstaller (onedir), copies the
        # SPA/icons, and invokes `iscc` when it's on PATH.
        shell: bash
        run: bash scripts/build-desktop.sh
      - name: Smoke test — packaged daemon boots
        # Boots the bundled daemon headlessly (--smoke-test) and asserts its
        # HTTP server answers. Catches a bundle that builds but cannot start —
        # e.g. the httptools packaging gap that uvicorn dies on — which
        # upload-artifact's file-exists check never would. The GUI-subsystem
        # exe detaches from the shell, so use Start-Process + WaitForExit to
        # capture the real exit code.
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Orbital\Orbital.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill($true); throw "Smoke test timed out (>90s)" }
          Write-Host "Orbital --smoke-test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Smoke test FAILED — packaged daemon did not boot" }
      - uses: actions/upload-artifact@v4
        with:
          name: Orbital-Windows-installer
          path: installer/Output/Orbital-Setup-*.exe
          if-no-files-found: error
