[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "0.8.6"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.39",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.24",
    "trafilatura>=1.6",
    "keyring>=24.0",
    "python-multipart>=0.0.5",
    "websockets>=11.0",
    "croniter>=1.3",
    "psutil>=5.9",
    "aiofiles>=23.0",
    "watchdog>=3.0",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.48",
    "agent-client-protocol==0.11.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
browser = [
    "patchright>=1.40",
]
office = [
    # Office document generation/parsing (Spec 007 Tier A): docx / xlsx / pptx
    # via pure-Python libraries, no pandoc/LibreOffice. See the
    # "Office Documents" skill hint in agent_os/agent/prompt_builder.py.
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]
macos = [
    # EventKit calendar source (Spec 011 §0.5). macOS-only; the calendar hub
    # degrades gracefully when it is absent, so this stays optional and is
    # never installed in CI / on non-macOS.
    "pyobjc-framework-EventKit>=10.0",
]
desktop = [
    "pywebview>=5.0",
    "pystray>=0.19",
    "Pillow>=10.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.1",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Resource markers: tests carrying these are SKIPPED by default unless the
# resource is present / explicitly opted into. See docs/TESTING-markers.md
# for the exact command to run each group on a real machine.
markers = [
    "live_daemon: spawns a real claude/codex/uvicorn process (opt-in: ORBITAL_LIVE_DAEMON_TESTS=1)",
    "live_sandbox: runs a REAL sandbox-exec against ~/Desktop — can EPERM-lock the dev tree (opt-in: ORBITAL_LIVE_SANDBOX_TESTS=1)",
    "requires_windows: needs a real Windows machine (powershell / ctypes.windll / win32 APIs)",
    "requires_keychain: needs a functional unlocked OS keychain (opt-in: ORBITAL_KEYCHAIN_TESTS=1)",
    "requires_relay: needs the relay server source tree at ./relay (not part of this checkout)",
]

[tool.setuptools.packages.find]
include = ["agent_os*"]
