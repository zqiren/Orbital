[supervisord]
logfile=%(ENV_HOME)s/.orbital/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=1
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=%(ENV_HOME)s/.orbital/logs/xvfb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:openbox]
command=/bin/bash -c 'until xdpyinfo -display :99 >/dev/null 2>&1; do sleep 0.3; done; exec /usr/bin/openbox'
priority=20
autorestart=true
stdout_logfile=%(ENV_HOME)s/.orbital/logs/openbox.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:x11vnc]
command=/bin/bash -c 'until xdpyinfo -display :99 >/dev/null 2>&1; do sleep 0.3; done; exec /usr/bin/x11vnc -display :99 -localhost -nopw -forever -shared -noxdamage -quiet -rfbport 5900'
priority=30
autorestart=true
stdout_logfile=%(ENV_HOME)s/.orbital/logs/x11vnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=%(ENV_HOME)s/.orbital/logs/novnc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:orbital]
command=/usr/local/bin/python -m agent_os.server --host 0.0.0.0 --port 8000
directory=/home/orbital
priority=50
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_HOME)s/.orbital/logs/orbital.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
