# Minimal ACP automation composition assembled from PUBLISHED npm packages only.
# Goal: boot the ACP stdio server far enough to answer initialize + session/new.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
    persistenceRoot: './.sessions'
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are a coding assistant. Keep answers brief and factual.
