<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>README proposal editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; font-size: 13px; color: #1f2328; background: #fff; display: grid; grid-template-rows: 44px 1fr; }
  header { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #d0d7de; background: #f6f8fa; }
  header .title { font-weight: 600; margin-right: 6px; }
  header .tab { padding: 4px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }
  header .tab.on { background: #0969da; color: #fff; border-color: #0969da; }
  header .spacer { flex: 1; }
  header .status { color: #57606a; }
  header .status.err { color: #cf222e; }
  header button.act { padding: 4px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 460px; min-height: 0; }
  #preview { overflow: auto; padding: 28px 36px; background: #fff; }
  .markdown-body { max-width: 900px; margin: 0 auto; }
  .blk { position: relative; border: 1px solid transparent; border-radius: 6px; padding: 2px 10px; margin: 0 -10px; cursor: pointer; }
  .blk:hover { border-color: #54aeff; background: rgba(221, 244, 255, .35); }
  .blk.sel { border-color: #0969da; background: rgba(221, 244, 255, .6); }
  .blk > :last-child { margin-bottom: 8px; }
  .blk img { max-width: 100%; }
  aside { border-left: 1px solid #d0d7de; display: flex; flex-direction: column; min-height: 0; background: #fff; }
  aside .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #d0d7de; color: #57606a; }
  aside .bar .grow { flex: 1; }
  aside .bar button { padding: 2px 8px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; font: inherit; }
  aside textarea { flex: 1; width: 100%; box-sizing: border-box; border: 0; resize: none; padding: 12px; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, "PingFang SC", monospace; outline: none; }
  aside textarea:focus { background: #fbfdff; }
  aside .hint { padding: 8px 12px; border-top: 1px solid #d0d7de; color: #57606a; line-height: 1.5; }
  aside .hint code { background: #f6f8fa; padding: 1px 4px; border-radius: 4px; }
  #empty { padding: 40px; color: #57606a; }
</style>
</head>
<body>
<header>
  <span class="title">README proposal</span>
  <button class="tab" data-file="README.md">README.md（中文）</button>
  <button class="tab" data-file="README.en.md">README.en.md</button>
  <span class="spacer"></span>
  <span id="status" class="status"></span>
  <button class="act" id="copy">Copy markdown</button>
</header>
<main>
  <div id="preview"><div id="empty">Loading…</div><div class="markdown-body" id="doc"></div></div>
  <aside>
    <div class="bar">
      <span id="blkinfo">Click any block on the left to edit it</span>
      <span class="grow"></span>
      <button id="prev" title="previous block">↑</button>
      <button id="next" title="next block">↓</button>
      <label><input type="checkbox" id="full"> full source</label>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="Select a block on the left, then edit its markdown here. Changes render live and save to docs/i18n/pending/."></textarea>
    <div class="hint" id="hint">Autosaves to <code>docs/i18n/pending/<span id="fname">README.md</span></code>. ⌘S saves now. Images resolve from the repo's <code>docs/</code>.</div>
  </aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  const FILES = ['README.md', 'README.en.md'];
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let file = FILES.includes(params.get('file')) ? params.get('file') : 'README.md';
  let leading = '', trailingNewline = true, blocks = [], sel = -1, saveTimer = 0, dirty = false;

  // ---- markdown <-> blocks (lossless: blank-line runs are kept as `gap`) ----
  function split(src) {
    const lines = src.split('\n');
    trailingNewline = src.endsWith('\n');
    if (trailingNewline) lines.pop();
    leading = '';
    const out = [];
    let cur = [], fence = false;
    const flush = () => { if (cur.length) { out.push({ text: cur.join('\n'), gap: '' }); cur = []; } };
    for (const line of lines) {
      if (/^\s*(```|~~~)/.test(line)) fence = !fence;
      if (!fence && line.trim() === '') {
        flush();
        if (out.length) out[out.length - 1].gap += line + '\n'; else leading += line + '\n';
        continue;
      }
      cur.push(line);
    }
    flush();
    return out;
  }
  function join() {
    return leading + blocks.map((b, i) => {
      const last = i === blocks.length - 1;
      return b.text + (last ? (trailingNewline ? '\n' : '') : '\n') + b.gap;
    }).join('');
  }

  // ---- rendering ----
  function renderBlock(i) {
    const el = $('doc').querySelector(`.blk[data-i="${i}"]`);
    if (!el) return;
    el.innerHTML = marked.parse(blocks[i].text, { gfm: true, breaks: false });
    for (const img of el.querySelectorAll('img')) {
      const src = img.getAttribute('src') || '';
      if (src && !/^(https?:|data:|\/)/.test(src)) img.setAttribute('src', '/__i18n/asset/' + src);
    }
  }
  function renderAll() {
    const doc = $('doc');
    doc.innerHTML = blocks.map((_, i) => `<div class="blk" data-i="${i}"></div>`).join('');
    blocks.forEach((_, i) => renderBlock(i));
    $('empty').hidden = true;
  }

  // ---- selection / editing ----
  function select(i, scroll) {
    sel = i;
    for (const el of $('doc').querySelectorAll('.blk')) el.classList.toggle('sel', +el.dataset.i === i);
    if (i < 0) { $('blkinfo').textContent = 'Click any block on the left to edit it'; return; }
    $('blkinfo').textContent = `Block ${i + 1} / ${blocks.length}`;
    if (!$('full').checked) { $('editor').value = blocks[i].text; }
    if (scroll) $('doc').querySelector(`.blk[data-i="${i}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  $('doc').addEventListener('click', (e) => {
    const blk = e.target.closest('.blk');
    if (!blk) return;
    if (e.target.closest('a')) e.preventDefault();
    select(+blk.dataset.i, false);
    $('editor').focus();
  });
  $('editor').addEventListener('input', () => {
    if ($('full').checked) {
      blocks = split($('editor').value); renderAll(); select(-1, false);
    } else if (sel >= 0) {
      blocks[sel].text = $('editor').value; renderBlock(sel);
    } else return;
    dirty = true; scheduleSave();
  });
  $('full').addEventListener('change', () => {
    if ($('full').checked) { $('editor').value = join(); $('blkinfo').textContent = 'Full source'; }
    else { select(Math.max(sel, 0), false); }
  });
  $('prev').addEventListener('click', () => select(Math.max(0, sel - 1), true));
  $('next').addEventListener('click', () => select(Math.min(blocks.length - 1, sel + 1), true));

  // ---- persistence ----
  function setStatus(msg, err) { const s = $('status'); s.textContent = msg; s.classList.toggle('err', !!err); }
  function scheduleSave() { clearTimeout(saveTimer); setStatus('Unsaved…'); saveTimer = setTimeout(save, 600); }
  async function save() {
    clearTimeout(saveTimer);
    if (!dirty) return;
    try {
      const r = await fetch(`/__i18n/readme/source?file=${encodeURIComponent(file)}`, { method: 'PUT', headers: { 'Content-Type': 'text/markdown; charset=utf-8' }, body: join() });
      if (!r.ok) throw new Error(await r.text());
      dirty = false;
      setStatus(`Saved ${new Date().toLocaleTimeString()}`);
    } catch (e) { setStatus(`Save failed: ${e.message || e}`, true); }
  }
  async function load() {
    for (const t of document.querySelectorAll('header .tab')) t.classList.toggle('on', t.dataset.file === file);
    $('fname').textContent = file;
    document.documentElement.lang = file === 'README.md' ? 'zh' : 'en';
    history.replaceState(null, '', `?file=${encodeURIComponent(file)}`);
    setStatus('Loading…');
    const r = await fetch(`/__i18n/readme/source?file=${encodeURIComponent(file)}`);
    if (!r.ok) { $('empty').hidden = false; $('empty').textContent = `No draft at docs/i18n/pending/${file} (${r.status}).`; return; }
    blocks = split(await r.text());
    renderAll(); select(-1, false); $('editor').value = ''; dirty = false;
    setStatus(`Loaded ${blocks.length} blocks`);
  }
  for (const t of document.querySelectorAll('header .tab')) t.addEventListener('click', async () => { await save(); file = t.dataset.file; load(); });
  $('copy').addEventListener('click', async () => { await navigator.clipboard.writeText(join()); setStatus('Copied to clipboard'); });
  document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  load();
})();
</script>
</body>
</html>
